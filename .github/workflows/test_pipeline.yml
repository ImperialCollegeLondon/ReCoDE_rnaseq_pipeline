
name: Pipeline CI

on: [push, pull_request]

jobs:
  run_pipeline:
    name: Run pipeline with test data

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        profile: [ docker ]

    runs-on: ${{ matrix.os }}

    env:
      OS: ${{ matrix.os }}
      NXF_SYNTAX_PARSER: 'v1'

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Nextflow

        env:
          NXF_VER: '26.10.6'

        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Make scripts executable
        run: chmod +x ${GITHUB_WORKSPACE}/bin/*.sh
      
      - name: Run pipeline
        run: nextflow run ${GITHUB_WORKSPACE} -profile test,${{ matrix.profile }} --outdir ./results
        
  simple_script:
    name: Run the simple pipeline script

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    env:
      OS: ${{ matrix.os }}

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v7.0.1
        
      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          miniforge-version: latest
          auto-update-conda: true
          activate-environment: recode_rnaseq
          environment-file: environment.yml
          conda-solver: libmamba
          
      - name: Make scripts executable
        run: |
            chmod +x ${GITHUB_WORKSPACE}/bin/*.sh
            chmod +x ${GITHUB_WORKSPACE}/workflows/simple_local_pipeline.sh
      
      - name: Run pipeline
        shell: bash -el {0}
        run: ${GITHUB_WORKSPACE}/workflows/simple_local_pipeline.sh
        
  docker:
    name: Push FastQC image to DockerHub
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v7.0.1

      - name: Login to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to DockerHub
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          tags: jackgisby/fastqc:latest
